name = "elo-bot"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
RNGDLE_CHANNEL_ID = "1536627129691938846"
# Comma-separated Discord user IDs that are banned from RNGdle. Their results are
# ignored, they are wiped from the all-time leaderboard, and the bot denies them
# write access to the channel. Deploy after changing.
RNGDLE_BANNED_IDS = "1411995926301638731"

# Cron is always UTC. Both entries fire daily; the handler only acts on the
# one that lands at 16:00 in Copenhagen, since Copenhagen alternates between
# UTC+1 (CET) and UTC+2 (CEST) across the year.
[triggers]
crons = ["0 14 * * *", "0 15 * * *"]